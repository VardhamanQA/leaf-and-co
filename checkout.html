<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – Leaf &amp; Co</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="checkout">
  <nav class="nav">
    <a href="index.html" class="brand" id="brand">Leaf &amp; Co</a>
    <div class="links">
      <a href="index.html" id="nav-shop">Shop</a>
      <a href="cart.html" id="nav-cart">Cart (<span class="badge" id="cart-count">0</span>)</a>
    </div>
  </nav>
  <main>
    <h1>Checkout</h1>
    <form id="checkout-form" class="card form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" autocomplete="name" aria-describedby="name-error">
        <p class="error" id="name-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" aria-describedby="email-error">
        <p class="error" id="email-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="address">Address</label>
        <input type="text" id="address" autocomplete="street-address" aria-describedby="address-error">
        <p class="error" id="address-error" aria-live="polite"></p>
      </div>
      <button type="submit" id="place-order">Place order</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
