<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop – Leaf &amp; Co</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">

    <div class="links">
