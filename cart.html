<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart – Leaf &amp; Co</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cart">
  <nav class="nav">
    <a href="index.html" class="brand" id="brand">Leaf &amp; Co</a>
    <div class="links">
      <a href="index.html" id="nav-shop">Shop</a>
      <a href="cart.html" id="nav-cart" aria-current="page">Cart (<span class="badge" id="cart-count">0</span>)</a>
    </div>
  </nav>
  <main>
    <h1>Your cart</h1>
    <p id="empty-msg" hidden>Your cart is empty</p>
    <section id="cart-items" class="stack"></section>
    <section id="cart-summary" class="card summary" hidden>
      <p>Subtotal: <strong id="subtotal">$0.00</strong></p>
      <button type="button" id="checkout-btn">Proceed to checkout</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
